# 角色库条目 —— 一个可复用的"演员"。在剧本里用 `cast: yuki` 选她出演。
name: 小雪
# appearance：英文，只写「这个人长什么样」（画风交给 styles/，不要在这里写风格词）。
appearance: "an 18-year-old girl, short black bob, large expressive eyes, soft gentle features, wearing a beige trench coat and a light scarf"
personality: "安静、温柔、内向，习惯把心事藏起来；细腻、念旧"
tone: "轻声细语，句子短，略带文艺、内省"   # 写台词时的语气参考
voice: zh-CN-XiaoxiaoNeural               # edge-tts 声音（配音用）
ref: ref.png                              # 参考图（python run.py genref yuki 生成，或自己放）
lora: null                                # 训了角色 LoRA 再填（python run.py train yuki 后会放到 ComfyUI/models/loras/yuki.safetensors）
lora_trigger: yuki                        # 提示词里激活 LoRA 的触发词（训练 caption 与出图都用它）
