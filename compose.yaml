# 组合模板（glue）—— 把素材拼成「出图提示词」时附加的指令。可编辑，**不写死在引擎里**，
# 引擎因此保持零内容。组合器(shotforge/compose.py)按"这一镜用了哪些素材"挑模板拼接。
aspect: "竖构图 9:16。"
# base 链式：第一张参考图=座位/构图/场景，其余=人物相貌
base: "第一张参考图给出这一幕的座位、构图与场景，其余参考图给出人物相貌；保持同一个人、坐在与第一张完全相同的座位与姿态（始终坐着），只改变画面所述的动作与景别。"
# 有主体(角色) + 有场景图
char_scene: "把参考图中的人物自然地放进同一个场景；保持人物相貌、场景布局与画风完全一致。"
# 有主体(角色) 但没有场景图
char_only: "保持与参考图完全相同的人物（相同的脸、发型、服装）。"
# 无主角的镜头(群演/空镜) + 有场景图
scene_only: "使用与参考图完全相同的场景、画风与画幅；画面中不要出现主角，只呈现所述的人物或空镜。"
