# 组合模板（glue）—— 把素材拼成「出图提示词」时附加的指令。可编辑，**不写死在引擎里**，
# 引擎因此保持零内容。组合器(shotforge/compose.py)按"这一镜用了哪些素材"挑模板拼接。
aspect: "竖构图 9:16。"
# base 链式（continue）：保持同一构图/机位，只换动作/景别（如“同座位换动作”）
base: "第一张参考图给出这一幕的座位、构图与场景，其余参考图给出人物相貌；保持同一个人、坐在与第一张完全相同的座位与姿态（始终坐着），只改变画面所述的动作与景别。"
# base 链式（reframe）：同一空间锚点，但允许重新设机位（含 180° 反打）
base_reframe: "以第一张参考图为同一空间锚点：保持其中的场景（桌子/窗户/灯光）以及两人各自的座位位置与相貌完全一致；但按画面描述【重新设置机位与取景】——这是同一张桌子的另一机位，可以是 180° 反打（把相机移到对侧人物的身后）。背景要呈现新机位下应当看到的那一侧，不要沿用原机位的背景。其余参考图给出人物相貌。"
# 有主体(角色) + 有场景图
char_scene: "把参考图中的人物自然地放进同一个场景；保持人物相貌、场景布局与画风完全一致。"
# 有主体(角色) 但没有场景图
char_only: "保持与参考图完全相同的人物（相同的脸、发型、服装）。"
# 无主角的镜头(群演/空镜) + 有场景图
scene_only: "使用与参考图完全相同的场景、画风与画幅；画面中不要出现主角，只呈现所述的人物或空镜。"
# end：从首帧"编辑"出尾帧（FLF2V 用）——保持完全一致，只把运动推进一点点
end: "保持与参考图完全相同的场景、视角、光线、主体与构图；只把画面中的运动/位置向前推进一点点（动作放缓的下一刻），其余一切都不要改变。"
