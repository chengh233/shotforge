# 第一人称情侣问答（男友视角）。最稳的做法：I2V —— 所有段都从同一张女友照片动起来，
# 人脸/场景跨段完全一致；每段是她不同的反应+台词。男友=镜头(不出镜)，女友对镜头(=对着你)说话。
#
# 你要做的：用 nano banana 出一张女友照片（她直视镜头、温馨居家、写实、竖屏 9:16），
#   存到 projects/couple/frames/gf.jpeg —— 所有段共用这一张。
# 然后：python run.py video projects/couple  →  dub  →  post
# 提示词建议见对话；每段 ≤5s（Wan 甜区）。

title: 情侣问答
fps: 16
engines:
  video: wan        # I2V：动你那张女友照片（用已有的 comfyui/wan_i2v_api.json，不需要 T2V）

cast: {girlfriend: xiaolu}
style: vlog          # 写实手机自拍质感

defaults:
  seconds: 5
  seed: 0
  camera: handheld   # 第一人称手持感
  negative: "动画，卡通，插画，最差质量，低质量，畸形的脸，多余的手指，多个不同的人，水印，文字，静止不动"

shots:
  # 每段都用同一张 frames/gf.jpeg 当起始帧 → 人物/场景一致；只有"她在说什么/做什么反应"在变。
  # 男友的问题/梗写在注释里（可在 post 里加成字幕，或你自己念旁白）；台词=女友的话。

  # 动作一律低幅度：只动脸/头/嘴，不抬手、不做手势（手最易畸形、最破坏一致性）。

  # s1 · 开场·设定游戏
  - id: s1
    frame: frames/gf.jpeg
    speaker: girlfriend
    action: "女友看着镜头自然地微笑、轻声说话，只有轻微的头部与嘴部动作，表情柔和；动作幅度很小、画面稳定"
    dialogue: "来，今天跟你玩个小游戏——输了的人请喝奶茶哦！"

  # s2 · 出题
  - id: s2
    frame: frames/gf.jpeg
    speaker: girlfriend
    action: "女友看着镜头说话，微微歪一下头、眼神俏皮，表情自然；动作幅度很小、画面稳定"
    dialogue: "还记得我们第一次约会去哪吗？想不起来今晚你洗碗～"

  # s3 · 打趣反应
  - id: s3
    frame: frames/gf.jpeg
    speaker: girlfriend
    action: "女友看着镜头轻轻笑了一下、眼睛弯起，开心的神情；只有细微的表情变化，动作幅度很小"
    dialogue: "诶——表情怎么慌啦？哈哈，碗有着落咯。"

  # s4 · 甜蜜收尾
  - id: s4
    frame: frames/gf.jpeg
    seconds: 6
    speaker: girlfriend
    action: "女友看着镜头温柔地微笑、轻轻眨眼，轻声说话收尾，眼神含笑；动作幅度很小、保持稳定"
    dialogue: "好啦不逗你了，记得想我哦。"
