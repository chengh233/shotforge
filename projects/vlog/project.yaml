# T2V vlog：混血女孩(米拉)自拍，不同场景，每条 5-10s，纯文字一次生成、无需参考图。
#
# 两种用法：
#  · 同一个人(本工程默认)：cast: mira → 她的详细外貌逐字拼进每条 + 固定 seed。
#    脸"像但会漂"，对随手刷的 vlog 够用；要精确锁脸见 README（参考图/LoRA）。
#  · 不同的人(每条换脸)：把每条 shot 的 content 写成不同的女孩、或删掉 cast —— 纯 T2V、不用图。

title: vlog
fps: 16
engines:
  video: wan-t2v        # 文生视频（需 Wan T2V 模型 + comfyui/wan_t2v_api.json）

cast: mira              # 同一个混血女孩（外貌拼进每条提示词）
style: vlog             # 写实自拍 vlog 画风

defaults:
  steps: 40
  seconds: 7            # 单条 5-10s
  seed: 7               # 固定 seed，尽量让脸跨片段更接近
  camera: handheld      # 自拍手持感
  negative: "动画，卡通，插画，3D渲染，最差质量，低质量，畸形的脸，多余的手指，多个不同的人，水印，文字"

shots:
  # 每条 = 一个场景的自拍 vlog（她举着手机、对镜头说话）。各自独立、一次生成。
  - id: s1
    frame: frames/s1.jpeg   # T2V 用不到，仅占位
    action: "年轻混血女孩举着手机自拍，对着前置镜头微笑说话；背景是阳光明媚的露天咖啡馆，桌上一杯拿铁，绿植与暖光，街边行人虚化；她头发被微风轻拂，神情轻松愉快"
    dialogue: "嗨大家好～今天来这家咖啡馆，也太出片了吧！"

  - id: s2
    frame: frames/s2.jpeg
    seconds: 8
    action: "同一个混血女孩在海边自拍，对着镜头说话、被海风吹乱头发又笑着拨开；背景是蓝色大海与白色浪花、傍晚金色阳光，海平线开阔；画面明亮通透、生活感十足"
    dialogue: "看这个海！风好大，但是真的太治愈了。"

  - id: s3
    frame: frames/s3.jpeg
    action: "同一个混血女孩一边走一边自拍，对镜头说话；背景是热闹的城市街道，霓虹招牌与橱窗、来往人群虚化，傍晚街灯亮起；轻微的走动晃动感，时髦都市氛围"
    dialogue: "带你们逛逛这条街，到处都好好拍～"

  - id: s4
    frame: frames/s4.jpeg
    action: "同一个混血女孩在温馨的卧室里自拍，半躺靠着枕头、对镜头轻声说话并比心；背景是暖色床头灯、柔软床品与挂着小串灯的墙，氛围温馨慵懒"
    dialogue: "回到家啦，今天就分享到这里，记得点赞关注哦～"
