# 第一人称极限运动 / 高空坠落，约 30s（6 镜 × 5s），480p。
# 稳定策略：放缓动作 + 首尾帧(FLF2V)。每镜：
#   起始帧(content) 用 Qwen 文生图；尾帧(end_content) 由起始帧"编辑"出来（同场景、动作只推进一点）→ 首尾天然一致；
#   Wan FLF2V 在首尾两张之间补运动 → 不漂、稳。快节奏靠"多镜快切"，不靠单镜暴力运动。
#
# 需要：Qwen 文生图工作流 comfyui/qwen_image_api.json + Qwen-Image-Edit 工作流 comfyui/qwen_edit_api.json
#       + Wan 首尾帧工作流 comfyui/wan_flf_api.json
# 流程：run.py frames（出 6 首帧 + 6 尾帧）→ manga → video（FLF2V）→ post --music

title: 高空坠落
model: wan-480p
fps: 16
engines:
  image: qwen            # 起始帧=Qwen文生图；尾帧(带参考)自动走 Qwen-Image-Edit
  video: wan-flf         # 首尾帧补间（比单帧 I2V 稳）
style: action

defaults:
  seconds: 5
  seed: 0
  negative: "动画，卡通，CG渲染，最差质量，低质量，畸形，水印，文字，剧烈抖动，画面撕裂，多个不同的人"

shots:
  # s1 · 崖边俯瞰（极轻微前倾）
  - id: s1
    frame: frames/s1.jpeg
    camera: static
    content: "第一人称POV：站在高耸悬崖的边缘向下俯瞰，脚尖探出崖边，远处是翻涌的云海与缩小的群山大地，眩晕的高度感；明亮日光"
    end_content: "同一悬崖边缘的视角，人物身体极轻微地再前倾一点、向下望，发丝被风吹起，其余完全一致"
    action:  "镜头与人物极轻微地前倾下望，风掠过，脚下云海缓缓移动，临跳前的紧张"

  # s2 · 起跳·平稳下坠开始
  - id: s2
    frame: frames/s2.jpeg
    camera: static
    content: "第一人称POV：刚离开崖边的瞬间，画面略向下倾斜，脚下是云层与大地，开始下坠"
    end_content: "同一坠落视角，画面再向下倾斜一点、云层与大地稍微近一些，其余一致"
    action:  "画面缓缓向下倾斜、平稳地开始下坠，云层缓缓逼近，失重感"

  # s3 · 穿云·平稳俯冲
  - id: s3
    frame: frames/s3.jpeg
    camera: static
    content: "第一人称POV：高空下坠穿过翻涌的白色云层，双臂在画面边缘张开，下方隐约是辽阔大地"
    end_content: "同一穿云视角，云雾再向后流过一点、位置略低，其余一致"
    action:  "在云中平稳下坠，云雾缓缓向画面两侧流过，强烈的失重感"

  # s4 · 翼装·沿崖壁平稳掠过
  - id: s4
    frame: frames/s4.jpeg
    camera: static
    content: "第一人称POV：翼装飞行贴着陡峭岩壁掠过，两侧是嶙峋的山脊与峡谷"
    end_content: "同一贴崖视角，沿崖壁再向前推进一点、崖壁稍微后退，其余一致"
    action:  "沿着岩壁平稳向前掠过，崖壁与山脊缓缓向后退去，速度感"

  # s5 · 低空·掠过湖面
  - id: s5
    frame: frames/s5.jpeg
    camera: static
    content: "第一人称POV：低空贴着碧蓝湖面掠过，水面反射阳光，远处是青翠山林"
    end_content: "同一掠湖视角，再向前掠过一点、水面缓缓流过，其余一致"
    action:  "贴着湖面平稳低空掠过，水面在脚下缓缓流过，波光粼粼"

  # s6 · 开伞·平稳飘落（收尾）
  - id: s6
    frame: frames/s6.jpeg
    seconds: 6
    camera: static
    content: "第一人称POV：降落伞已打开，仰头可见彩色伞面，下方是辽阔大地与地平线，金色阳光，开阔放松"
    end_content: "同一伞下视角，再缓缓飘低一点、大地稍微近一些，其余一致"
    action:  "在降落伞下平稳缓缓飘落，辽阔的大地缓缓变近，松一口气的开阔感"
