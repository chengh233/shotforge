# 一个 shotforge 项目 = 一部短剧。
#
# 新建一部短剧：复制整个文件夹
#     cp -r projects/example projects/ep01
# 然后改下面的字段，把每个镜头的「起始帧 PNG」放进 frames/。
#
# 示例剧本：《夏风》—— 4 个镜头的日系动漫小品（夏日天台，午后到黄昏）。
#
# ⭐ 这个示例按「最容易出高质量、最不像 AI」的原则设计：
#   1) 日系动漫赛璐璐风——避开写实恐怖谷，平涂色块/干净线条运动时不易"融化"。
#   2) 只用细微/环境动作（风、云、眨眼、风铃）——I2V 的甜区；不做走/跑/转身。
#   3) 画面干净、主体突出——杂乱前景在运动中最容易崩（见 docs/PIPELINE.md）。

project: 夏风             # 显示名；省略则用文件夹名
model: wan-480p          # 草稿档(快)；出高质量定稿换 wan(720P) 并把 steps 提到 50
fps: 16                  # Wan 2.1 按 16fps 训练

# 💡 提示词语言：wan 用 umT5（多语言），运动提示词可直接写中文。
#   模型只看画面不看台词——不生成台词/字幕/配音（后期单独加，见 docs/PIPELINE.md）。

defaults:
  # 不写 width/height：Wan I2V 按起始帧长宽比自动推导分辨率（用 backend 面积预算）。
  steps: 40              # 草稿 40；定稿可提到 50
  seconds: 5
  seed: 0
  negative: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走"

# 每个镜头：起始帧 + 描述「画面怎么动」的提示词（出图提示词见 frames/PROMPTS.md）。
# 所有镜头都只用"细微动作"——这是高质量、不崩坏的关键。
shots:
  # 镜头1（定场·远景）：夏日天台，少女靠栏杆望向远处城市，风与云。
  - id: s1
    frame: frames/s1.jpeg
    prompt: "夏日晴空下的学校天台，一个穿水手服的少女靠着蓝色栏杆望向远处城市；微风轻拂她的长发与裙摆，天空的白云缓缓飘动；镜头几乎静止，日系动漫赛璐璐风格，画面干净通透。"

  # 镜头2（近景·特写）：少女侧脸，刘海被风吹动，缓缓眨眼。
  - id: s2
    frame: frames/s2.jpeg
    prompt: "少女的侧脸特写，微风吹动她的刘海，她缓缓眨了下眼、轻轻呼吸；背景是虚化的夏日蓝天，柔和的阳光，日系动漫风格，画面干净。"

  # 镜头3（空镜·小物）：栏杆上的玻璃风铃随风轻摇，背景夏云移动。无人物。
  - id: s3
    frame: frames/s3.jpeg
    prompt: "天台栏杆上挂着一只玻璃风铃，随微风轻轻摇晃，下方的白色纸短签随风飘动；背景是缓缓移动的夏日白云；日系动漫风格，画面干净，有空气感。"

  # 镜头4（黄昏·收尾）：同一天台黄昏，少女望向被夕阳染橙的天空。
  - id: s4
    frame: frames/s4.jpeg
    seconds: 8           # 更长的一镜，演示如何超过 5s 默认值
    prompt: "黄昏的学校天台，少女望向被夕阳染成橙色的天空；晚风轻拂她的发丝，橙色的云层缓缓流动；光线柔和温暖，日系动漫赛璐璐风格，画面干净。"
