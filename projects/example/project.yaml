# 一个 shotforge 项目 = 一部短剧。
#
# 新建一部短剧：复制整个文件夹
#     cp -r projects/example projects/ep01
# 然后改下面的字段，把每个镜头的「起始帧 PNG」放进 frames/。
# 起始帧用 Dreamina / 即梦 等工具按 9:16 出图（出图提示词见 frames/PROMPTS.md）。
#
# 示例剧本：《夜班》—— 一个 4 镜头的连贯小故事。

project: 夜班              # 显示名；省略则用文件夹名
model: wan                # 后端：wan(默认, Wan2.1-I2V-14B-720P) / wan-480p(草稿) / ltx
fps: 16                   # 帧率；Wan 2.1 按 16fps 训练，省略则用 backend.default_fps

# 💡 提示词语言：wan 的文本编码器是 umT5（多语言），下面的「运动提示词」可直接写中文。
#   若改用 model: ltx（T5，偏英文），运动提示词请改成英文。
#   注意：模型只看画面不看台词——它不生成台词/字幕/配音（见 docs/PIPELINE.md）。

# defaults 里的值对每个镜头生效，除非镜头自己覆盖。
defaults:
  width: 720              # 9:16 竖屏，匹配 wan 720P；删掉这两行则用 backend 默认分辨率
  height: 1280
  steps: 40               # 去噪步数；越高越慢，通常越干净
  seconds: 5              # 单镜头时长；想超过 5s 见 README / tools/last_frame
  seed: 0
  # Wan 官方推荐的中文 negative（专门调过，明显提质）
  negative: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走"

# 每个镜头：id + 起始帧（相对本文件夹）+ 描述「画面里发生什么」的运动/镜头提示词。
shots:
  # 镜头1：深夜空办公室，女主疲惫地从电脑前抬头望向窗外。
  - id: s1
    frame: frames/s1.png
    prompt: "深夜空荡的办公室里，一位疲惫的女人独自坐在工位前，缓缓抬起头望向窗外；暖色台灯柔光，镜头缓慢推进，电影感冷色调，发丝与呼吸轻微起伏。"

  # 镜头2：手机屏幕亮起一条到账通知，冷光打在她的手和脸上。
  - id: s2
    frame: frames/s2.png
    prompt: "特写：她手中的手机屏幕亮起一条到账通知，冷蓝色的屏幕光在手指和脸上闪动；浅景深，手指轻微颤抖，眼神微微睁大。"

  # 镜头3：她猛地起身，一把抓起椅背的风衣转身冲向门口。
  - id: s3
    frame: frames/s3.png
    prompt: "女人猛地站起身，一把抓起椅背上的风衣，急促地转身走向门口；手持镜头，轻微运动模糊，动作充满急迫感。"

  # 镜头4（更长的一镜）：雨夜街头，男人撑伞在路灯下等她，她从远处跑来。
  - id: s4
    frame: frames/s4.png
    seconds: 8            # 更长的一镜，演示如何超过 5s 默认值
    prompt: "雨夜霓虹的街道，一个男人撑着黑伞站在路灯下等待，倒影映在湿漉漉的路面；远处一个女人朝他跑来，镜头从男人背后缓缓跟拍，细雨飘落，电影感。"
