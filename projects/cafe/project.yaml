# 验收 demo：咖啡馆两人对话。
# 思路转变：不再生成「正反打的反打静帧」（太随机），而是
#   只可靠地出【一张双人主镜静帧 s0】，再用 I2V 的【运镜】做覆盖：
#   s1 相机推向右侧的男主(他说话)，s2 相机推向左侧的女主(她说话)。
#   两段视频都从同一张 s0 动起来 → 空间天然一致，不靠易翻车的反打静帧。
#
# 配 Nano Banana Pro 出主镜；Wan I2V 负责移镜。

title: 咖啡馆对话
fps: 16
engines:
  image: nanobanana
  image_model: gemini-3-pro-image-preview   # Nano Banana Pro（出双人主镜更稳）
  video: wan

cast: {A: yuki, B: aki}   # A=小雪(女,坐左)，B=小秋(男,坐右)
scene: cafe
style: kyoani

defaults:
  steps: 40
  seconds: 5
  seed: 0
  negative: "最差质量，低质量，多余的手指，畸形的手，畸形的脸，字幕，文字，水印，杂乱背景，三条腿"

shots:
  # 主镜 s0 · 唯一要生成的静帧（双人定场，不单独出片，作为 s1/s2 的起始帧）
  - id: s0
    frame: frames/s0.jpeg
    still: true
    subjects: [A, B]
    content: "中景双人定场：午后咖啡馆靠窗的小木桌，A（小雪，女）坐在【左侧】、B（小秋，男）坐在【对面右侧】，两人隔着木桌相对而坐、面向彼此；旁边的大玻璃窗外有汽车与行人缓缓经过；暖色吊灯、温暖光线、浅景深，背景虚化的吧台。两人都清晰入镜。"

  # 镜头1 · 从主镜推向右侧的 B（B 在说话）—— I2V 运镜，不再生成新静帧
  - id: s1
    frame: frames/s0.jpeg     # 复用主镜作为起始帧
    camera: push_right
    subjects: []
    speaker: B
    action: "镜头从双人中景缓缓推近右侧的 B，B 双手捧着咖啡杯、微微前倾、嘴唇在动正在说话；窗外车辆与行人缓缓经过，咖啡杯升起袅袅热气"
    dialogue: "这家店，比我想象的还要安静。"

  # 镜头2 · 从主镜推向左侧的 A（A 在说话）
  - id: s2
    frame: frames/s0.jpeg     # 同一张主镜起始帧 → 空间一致
    camera: push_left
    subjects: []
    speaker: A
    action: "镜头从双人中景缓缓推近左侧的 A，A 靠在椅背上、指尖轻搭杯沿、嘴唇在动正在回话，神情柔和带浅笑；窗外车辆与行人缓缓经过，热气浮动"
    dialogue: "嗯……我也很久没有这么放松过了。"
