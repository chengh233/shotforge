# 验收 demo：咖啡馆两人对话（正反打 / shot-reverse-shot）。
# 只有 2 个出片镜头(s1/s2) + 1 个不出片的「主镜 s0」用来锁定空间。
#
# 空间一致性的关键：先用 s0 主镜把「谁坐哪、木桌、窗户」一次定死（不出片），
# 再让 s1/s2 都 base 在 s0 上重新取景 —— 两个视角共享同一空间。
# 配 Nano Banana Pro(gemini-3-pro-image-preview)：多图参考 + 多人一致 + 空间推理更强。

title: 咖啡馆对话
fps: 16
engines:
  image: nanobanana
  image_model: gemini-3-pro-image-preview   # Nano Banana Pro（空间/一致性更强）
  video: wan

cast: {A: yuki, B: aki}   # A=小雪(女)，B=小秋(男)
scene: cafe
style: kyoani

defaults:
  steps: 40
  seconds: 4
  seed: 0
  negative: "最差质量，低质量，多余的手指，畸形的手，畸形的脸，字幕，文字，水印，杂乱背景，三条腿"

shots:
  # 主镜 s0 · 定场（不出片，只用来锁空间）：一次定死座位/木桌/窗户
  - id: s0
    frame: frames/s0.jpeg
    still: true
    subjects: [A, B]
    content: "中景定场：午后咖啡馆靠窗的小木桌，A（小雪，女）坐在【左侧】、B（小秋，男）坐在【对面右侧】，两人隔着木桌相对而坐；旁边的大玻璃窗外有汽车与行人缓缓经过；暖色吊灯、温暖光线、浅景深，背景虚化的吧台。把两人的相貌、这张桌位与窗户的空间关系一次确定下来。"
    dialogue: ""

  # 镜头1 · 机位在 A 身后，越过 A 的肩看 B（B 在说话）
  - id: s1
    frame: frames/s1.jpeg
    base: s0
    base_mode: reframe
    camera: ots
    subjects: [B]
    speaker: B
    content: "与 s0 同一张桌子的镜头：机位在【左侧】A 的身后，越过 A 的肩膀与后脑（A 在前景、虚化、背对镜头）看向【右侧】坐着的 B；画面主体是正面朝向镜头方向的 B，B 双手捧着咖啡杯、微微前倾正在说话，神情温和认真；B 身后是这一侧的咖啡馆内景；窗外有车与行人经过。"
    action:  "B 嘴唇在动、偶尔点头，窗外车辆与行人缓缓经过，咖啡杯升起袅袅热气"
    dialogue: "这家店，比我想象的还要安静。"

  # 镜头2 · 反打：机位翻到 B 身后，越过 B 的肩看 A（A 在说话）
  - id: s2
    frame: frames/s2.jpeg
    base: s0
    base_mode: reframe
    camera: ots
    subjects: [A]
    speaker: A
    content: "与 s0 同一张桌子的【180° 反打镜头】：机位翻到【右侧】B 的身后，越过 B 的肩膀与后脑（B 在前景、虚化、背对镜头）看向【左侧】坐着的 A；画面主体是正面朝向镜头方向的 A，A 靠在椅背上、指尖轻搭杯沿正在说话，神情柔和带浅笑；A 身后是 A 这一侧的咖啡馆内景（不要沿用 s1 的背景）；窗外有车与行人经过。"
    action:  "A 嘴唇在动、轻轻笑了一下，窗外车辆与行人缓缓经过，热气浮动"
    dialogue: "嗯……我也很久没有这么放松过了。"
