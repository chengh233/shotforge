# 晚晚的自我介绍（单镜 · 5 秒 · 配音 · 对口型 · 轻微动作）
#
# 流程：frames(FLUX+wanwan LoRA) -> video(Wan I2V 加轻微动作) -> dub -> lipsync -> post
#   一句话台词，约 4–5 秒，正好落在 Wan 的 5s 片段里；嘴型由 LatentSync 重做。
title: 晚晚自我介绍
fps: 16                  # Wan 的训练帧率

engines:
  image: flux            # wanwan LoRA 出帧
  voice: cosyvoice       # 自然中文女声（预设「中文女」）；没装时退回 edge-tts 删掉这行即可
  talk: sonic            # 图+音频 一次出「动作+口型」（取代 Wan+LatentSync 两段式）
  # 旧的两段式引擎（如想回退到 video+lipsync 再用）：
  video: wan
  lipsync: latentsync

cast: {S: wanwan}        # 单人：S = 晚晚（语音 zh-CN-XiaoyiNeural）

defaults:
  seconds: 5
  steps: 20
  seed: 0
  negative: "最差质量，低质量，多余的手指，畸形的手，畸形的脸，闭眼，字幕，文字，水印，多人，剧烈运动，镜头剧烈晃动"

shots:
  - id: s1
    frame: frames/s1.jpeg
    camera: static
    subjects: [S]
    speaker: S
    # 起始帧（FLUX，英文；compose 自动加 wanwan 触发词）。正脸、中近景、嘴部清晰不被遮挡，利于对口型。
    content: "a photorealistic medium close-up portrait of a young woman with long black hair, fair clear skin, facing the camera at eye level, a gentle warm smile, lips slightly parted as if about to speak, soft natural makeup; wearing a cream knit sweater; seated in a cozy living room by a window, soft warm daylight, gently blurred background; 50mm lens, shallow depth of field, natural skin texture, highly detailed, photorealistic"
    # Wan 运动（中文）：只加细微的生命感——一个缓慢主运动 + 物理细节；嘴型之后由 LatentSync 重做，所以不写"说话"。
    action: "晚晚极轻微地缓缓点头，自然地眨了一下眼，几缕发丝随空气轻轻飘动，肩膀有细微的呼吸起伏；动作幅度很小、舒缓自然，画面整体平稳"
    dialogue: "大家好，我叫晚晚，很高兴认识你。"
