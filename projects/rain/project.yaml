# T2V 实验剧本：《雨》—— 直接用文字生成视频，不用起始帧。
# 为 T2V 量身定制：单一角色(小雪)、雨夜霓虹、动态/氛围强、对"脸精确一致"要求低。
# 一致性策略：每段都由组合器逐字拼上同一段角色描述(yuki.appearance) + 固定 seed。
#   —— 跨片段一致性仍弱于 I2V，属可接受的实验。
#
# 剧情：雨夜独行 → 屋檐下歇脚 → 疲惫的脸 → 雨渐停、释然 → 雨后启程。
# 引擎 video: wan-t2v（文生视频，无需 frames/ 与参考图）。

title: 雨
fps: 16
engines:
  video: wan-t2v        # 文生视频：Wan 2.2 T2V（需 T2V 模型 + comfyui/wan_t2v_api.json）

cast: yuki              # 角色描述拼进每段提示词（T2V 不用她的参考图，只用文字）
style: kyoani

defaults:
  steps: 40
  seconds: 5
  seed: 42              # 全片同一 seed，尽量让角色跨片段更接近
  negative: "色调艳丽，过曝，细节模糊不清，字幕，文字，水印，最差质量，低质量，多余的手指，畸形的手，畸形的脸，扭曲的肢体，杂乱背景，多个不同的人"

shots:
  # s1 · 雨夜独行（侧向跟随）
  - id: s1
    frame: frames/s1.jpeg     # T2V 用不到，仅占位
    seconds: 6
    camera: pan_left
    action: "深夜空旷的霓虹街道下着小雨；一名少女撑着透明雨伞独自走在湿漉漉的人行道上、脚步从容；地面积水里倒映着粉蓝与暖红的霓虹招牌，雨丝在路灯光束下根根分明、缓缓飘落，远处车灯的光晕在雨雾中散开；湿冷、安静而孤独的都市夜晚氛围"
    dialogue: "又是一个人的雨夜。"

  # s2 · 屋檐下歇脚（缓缓推近）
  - id: s2
    frame: frames/s2.jpeg
    camera: push_in
    action: "少女走到一家便利店暖黄灯光的屋檐下停住脚步，侧身收起透明雨伞、轻轻抖落伞面上的雨水，呼出一口淡淡白气，肩头放松、神情疲惫；身后便利店玻璃透出温暖灯光，店外是冷蓝的雨夜，暖冷光强烈对比，雨水顺着屋檐滴落"
    dialogue: "呼……终于到了。"

  # s3 · 疲惫的脸（特写·静）
  - id: s3
    frame: frames/s3.jpeg
    camera: static
    action: "少女的脸部特写，便利店暖黄灯光柔和地打在她脸上，黑色短发的发梢挂着细小雨珠、微微反光，她轻轻叹了一口气、眼神有些放空；浅景深，背景虚化成温暖光斑，淅淅沥沥的雨声"
    dialogue: "今天，也辛苦了吧。"

  # s4 · 雨渐停·释然（轻微上摇）
  - id: s4
    frame: frames/s4.jpeg
    camera: tilt_up
    action: "少女缓缓抬头望向夜空，雨势正渐渐变小；霓虹的光在湿漉漉的街面与水洼里晕染开来、轻轻流动，几滴雨珠从屋檐边缘滑落，她的神情透出一丝释然与平静；冷暖交织的霓虹夜色"
    dialogue: "雨，好像要停了。"

  # s5 · 雨后启程（拉远展开）
  - id: s5
    frame: frames/s5.jpeg
    seconds: 6
    camera: pull_back_reveal
    action: "雨停了，少女从屋檐下迈步走出、重新踏上街道；湿润的路面在霓虹与路灯下闪着粼粼水光、倒映出整条渐渐安静下来的街，她的背影从容地向前走去；画面通透明亮，带着雨后的清新与一丝希望"
    dialogue: "回家吧。"
