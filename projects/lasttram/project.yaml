# 一个 shotforge 项目 = 一部短剧。
#
# 剧本：《末班电车》—— 6 镜头，带一个小反转：独自归途的疲惫 → 一条消息 → 心境转暖。
#
# 起始帧用 Flux Kontext 一键生成（frames 阶段）：你只需提供 ONE 张角色参考图
# （character_ref），Kontext 让每镜都是"同一个人换场景"，保持一致。
#   python run.py frames projects/lasttram
# ⚠️ Flux Kontext 只懂英文，所以 frame_prompt 用英文；运动提示词(prompt)与台词(dialogue)仍中文。

project: 末班电车
model: wan-480p          # 480P 草稿(快)；定稿换 wan(720P)
fps: 16

# 选角：从角色库选 yuki(小雪) 出演——她的外貌/参考图/声音会自动带入。换演员改这一行即可。
cast: yuki

defaults:
  steps: 40
  seconds: 5
  seed: 0
  negative: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走"

shots:
  # 镜头1 · 拉远展开（疲惫·冷调）
  - id: s1
    frame: frames/s1.jpeg
    frame_prompt: "Change the scene to a quiet night tram: the same girl sits alone by the window, looking tired and a little downcast; dim dusk-blue light outside, soft warm interior lamp, cool melancholic mood."
    prompt: "黄昏的末班电车车厢，少女独自靠窗而坐、肩膀微塌、神情疲惫；镜头从她的近景极缓地向后拉远并轻微下降，逐渐展开整节安静空荡的车厢，吊环随车身轻轻摇晃，窗外暮色中的城市楼影与暖橙夕照缓缓向后流过、光斑掠过空座椅，空气里浮尘轻飘；日系动漫赛璐璐风格，电影感长镜头。"
    dialogue: "末班车，又是我一个人。"

  # 镜头2 · 推近侧脸（出神）
  - id: s2
    frame: frames/s2.jpeg
    frame_prompt: "The same girl gazes out the dark tram window, weary and absent-minded; deeper night outside, cool blue light and faint neon reflections on her face."
    prompt: "镜头缓缓推近到少女的侧脸特写，她疲惫地望向窗外、微微出神；窗外流动的霓虹灯火在她脸颊与睫毛上投下游移的光斑，刘海与碎发被微风轻轻吹动，她极轻地眨了一下眼、呼吸轻微起伏；浅景深、背景虚化，日系动漫电影感。"
    dialogue: "今天，也没什么特别的。"

  # 镜头3 · 横移视差（孤独）
  - id: s3
    frame: frames/s3.jpeg
    frame_prompt: "The same girl leans against the tram window with a faint, lonely expression; dark city night outside with streaking neon lights, cool blue tone."
    prompt: "镜头沿车窗向左缓缓横移（轨道移动），窗外的城市灯火、站台灯箱与行道树以明显的视差快速向后掠过，玻璃上倒映着流动的光带；少女靠在窗边，眼神随光影缓缓移动，发丝轻颤；夜色霓虹、略带寂寥，日系动漫风格。"
    dialogue: "回去，也只是空荡荡的房间。"

  # 镜头4 · 手机特写（转折点·冷光）
  - id: s4
    frame: frames/s4.jpeg
    frame_prompt: "The same girl looks down at her phone glowing with a new message, a flicker of surprise softening her face; cold blue screen light on her face, dark interior around her."
    prompt: "特写：少女手中的手机屏幕亮起一条消息通知，冷蓝色屏幕光骤然打亮她的手指与下半张脸；镜头极轻微地推近，她的视线落到屏幕、瞳孔微微一缩、指尖轻轻一动；背景车厢暖光虚化成柔和光斑，浅景深，日系动漫风格。"
    dialogue: "「到家了说一声，明天一起吃饭。」"

  # 镜头5 · 抬头微笑（反转·转暖）
  - id: s5
    frame: frames/s5.jpeg
    frame_prompt: "The same girl looks up from the phone with a soft, warm, relieved smile, gentle eyes; warm golden interior light on her face, tender mood."
    prompt: "少女缓缓从手机抬起头、望向窗外，紧绷的神情一点点化开，嘴角浮起一抹温柔的微笑、眼里泛起暖意；镜头轻轻推近，车厢暖光渐渐铺满她的脸（光色由冷转暖），发丝随抬头动作轻轻扬起，日系动漫电影感。"
    dialogue: "啊……原来，不是一个人。"

  # 镜头6 · 雨停暖光（希望·收尾）
  - id: s6
    frame: frames/s6.jpeg
    seconds: 6
    frame_prompt: "The same girl by the window in bright, clear morning light after the rain; calm and hopeful expression, soft warm daylight, blue sky outside — a warm contrast to the earlier cool night."
    prompt: "雨渐渐停歇，乌云裂开一道缝、暖光透过沾着残余雨珠的车窗洒进车厢，光束里浮尘缓缓飘动；镜头极缓地向后拉远并轻微上摇，少女安静地望向窗外渐亮的天色、神情释然温柔；窗上残留的雨痕缓缓滑落，柔和暖色调，日系动漫电影感。"
    dialogue: "明天，会是好天气吧。"
