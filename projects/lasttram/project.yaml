# 一个 shotforge 项目 = 一部短剧。
#
# 剧本：《末班电车》—— 6 镜头，带一个小反转：独自归途的疲惫 → 一条消息 → 心境转暖。
#
# ⭐ 设计要点：
#   - 剧情靠「台词/旁白 + 关键帧序列」承载，动作保持 I2V 安全区（运镜+半身微动作+环境）。
#   - 每镜一种镜头语言（拉远/推近/横移/手机特写/转头微笑/拉远收尾），避免画面单一。
#   - 转场建议：合成时用 `python run.py post projects/lasttram --crossfade 0.5 --fade 0.6`
#     （溶解 + 首尾淡入淡出），氛围片更连贯。

project: 末班电车
model: wan-480p          # 480P 草稿(快)；定稿换 wan(720P)
fps: 16

# 💡 运动提示词用中文(umT5)。出图提示词见 frames/PROMPTS.md。dialogue 用于配音+字幕。

defaults:
  steps: 40
  seconds: 5
  seed: 0
  negative: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走"

shots:
  # 镜头1 · 拉远展开（建立：独自一人的疲惫）
  - id: s1
    frame: frames/s1.jpeg
    prompt: "黄昏的电车车厢内，一名穿米色风衣的短发少女独自靠窗而坐，神情疲惫；镜头从她的近景缓缓向后拉远，展开整节安静空荡的车厢，窗外暮色与城市轮廓缓缓流动，暖橙色夕照洒入，日系动漫赛璐璐风格，电影感。"
    dialogue: "末班车，又是我一个人。"

  # 镜头2 · 推近侧脸（情绪：倦怠、出神）
  - id: s2
    frame: frames/s2.jpeg
    prompt: "镜头缓缓推近少女的侧脸特写，她疲惫地望向车窗外、微微出神；窗外流动的灯火在她脸上投下游移的光，发丝被微风轻拂，浅景深，日系动漫电影感。"
    dialogue: "今天，也没什么特别的。"

  # 镜头3 · 横移视差（情绪：孤独加深）
  - id: s3
    frame: frames/s3.jpeg
    prompt: "镜头沿车窗向一侧缓缓横移，窗外城市灯火、站台与树影产生视差快速掠过；少女靠在窗边，眼神随窗外移动，发丝轻动，日系动漫风格，夜色霓虹，略带寂寥。"
    dialogue: "回去，也只是空荡荡的房间。"

  # 镜头4 · 手机特写（转折点：一条消息）
  - id: s4
    frame: frames/s4.jpeg
    prompt: "特写：少女手中的手机屏幕亮起一条消息通知，冷蓝色屏幕光打在她的手指和脸上；她的视线落到屏幕上，浅景深，背景虚化的车厢暖光，日系动漫风格。"
    dialogue: "「到家了说一声，明天一起吃饭。」"

  # 镜头5 · 抬头·微笑（反转：原来不是一个人）
  - id: s5
    frame: frames/s5.jpeg
    prompt: "少女缓缓从手机抬起头，望向窗外，紧绷的神情慢慢化开，嘴角浮现一抹温柔的微笑，眼里泛起暖意；发丝随动作轻轻扬起，车厢暖光柔和，日系动漫电影感。"
    dialogue: "啊……原来，不是一个人。"

  # 镜头6 · 雨停·暖光收尾（希望）
  - id: s6
    frame: frames/s6.jpeg
    seconds: 6
    prompt: "雨渐渐停了，乌云裂开一道缝隙，暖光透过车窗洒进车厢；镜头极缓地向后拉远并轻微上升，少女安静地望向窗外渐亮的天色，神情释然温柔，日系动漫电影感，柔和暖色调。"
    dialogue: "明天，会是好天气吧。"
