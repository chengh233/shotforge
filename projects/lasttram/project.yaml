# 一个 shotforge 项目 = 一部短剧。
#
# 剧本：《末班电车》—— 黄昏 / 雨夜的末班电车上，少女独自归途的安静片刻（6 镜头）。
#
# ⭐ 这部刻意用「丰富的运镜」：每镜一种镜头语言（拉远 / 推近 / 横移 / 转头 / 环境），
#   避免画面单一。ComfyUI(Wan 2.2) 对运镜很稳，可以大胆用。仍遵守 I2V 原则：
#   运镜 + 半身微动作 + 环境动效，不做走/跑/转身等大幅肢体动作。

project: 末班电车
model: wan-480p          # 480P 草稿(快)；定稿换 wan(720P)
fps: 16

# 💡 运动提示词用中文（umT5 支持）。出图提示词见 frames/PROMPTS.md。
#   dialogue 是该镜的台词/旁白，用于配音(tools.dub) + 字幕(tools.subtitle)。

defaults:
  steps: 40
  seconds: 5
  seed: 0
  negative: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走"

shots:
  # 镜头1 · 拉远展开（建立空间）
  - id: s1
    frame: frames/s1.jpeg
    prompt: "黄昏的电车车厢内，一名穿米色风衣的短发少女靠窗而坐；镜头从她的近景缓缓向后拉远，展开整节安静空荡的车厢，窗外暮色与城市轮廓缓缓流动，暖橙色夕照洒入，日系动漫赛璐璐风格，电影感。"
    dialogue: "末班车的灯，总是有点暖。"

  # 镜头2 · 推近侧脸特写
  - id: s2
    frame: frames/s2.jpeg
    prompt: "镜头缓缓推近少女的侧脸特写，她静静望向车窗外；窗外流动的灯火在她脸上投下游移的光，发丝被微风轻拂，浅景深，日系动漫电影感。"
    dialogue: "今天，也平安地结束了。"

  # 镜头3 · 横移视差（背景掠过）
  - id: s3
    frame: frames/s3.jpeg
    prompt: "镜头沿车窗向一侧缓缓横移，窗外的城市灯火、站台与树影产生视差快速掠过；少女的眼神随窗外移动，发丝轻动，日系动漫风格，夜色霓虹。"
    dialogue: "窗外的光，一站一站地退后。"

  # 镜头4 · 转头看镜头 + 微笑
  - id: s4
    frame: frames/s4.jpeg
    prompt: "少女缓缓转过头看向镜头，嘴角浮现一抹淡淡的微笑，发丝随动作轻轻扬起；背景是车厢暖光与窗外流动的夜景，日系动漫风格。"
    dialogue: "偶尔，也想被谁看见。"

  # 镜头5 · 雨夜氛围 + 光斑（最丰富）
  - id: s5
    frame: frames/s5.jpeg
    seconds: 6
    prompt: "电车在雨夜行驶，细雨在车窗玻璃上划出流痕，窗外霓虹光斑在车厢内缓缓游移、掠过少女的身影；她望着窗外出神，气氛安静温柔，日系动漫电影感。"
    dialogue: "下雨了……正好。"

  # 镜头6 · 拉远定格（收尾）
  - id: s6
    frame: frames/s6.jpeg
    prompt: "镜头极缓地向后拉远并轻微上升，少女独自坐在暮色渐深的车厢一隅，车窗外灯火渐稀；整体安静、温柔、略带孤独，日系动漫电影感，柔和暖色调。"
    dialogue: "明天，会是好天气吧。"
